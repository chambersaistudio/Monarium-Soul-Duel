<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <title>MONARIUM: Soul Duel</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      width: 100%;
      height: 100%;
      background: #0a0a0f;
    }
    body {
      display: block;
      width: 100%;
      /* Use dynamic viewport height so the address bar on iOS doesn't shrink the game */
      height: 100dvh;
      overflow: hidden;
      background: #0a0a0f;
      touch-action: none;
    }
    canvas { display: block; touch-action: none; outline: none; image-rendering: auto; }

    #rotate-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #0a0a0f;
      color: #ff6600;
      font-family: monospace;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 9999;
      text-align: center;
      padding: 24px;
      user-select: none;
      -webkit-user-select: none;
    }
    #rotate-overlay .icon { font-size: 52px; }
    #rotate-overlay h2   { font-size: 20px; letter-spacing: 3px; }
    #rotate-overlay p    { font-size: 13px; color: #555555; margin-top: 4px; }

    /* Show only on touch devices in portrait */
    @media (pointer: coarse) and (orientation: portrait) {
      #rotate-overlay { display: flex; }
    }
  </style>
</head>
<body>
  <div id="rotate-overlay">
    <div class="icon">↺</div>
    <h2>ROTATE YOUR DEVICE</h2>
    <p>MONARIUM plays best in landscape mode</p>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
