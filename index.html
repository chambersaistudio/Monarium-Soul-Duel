<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover extends under iPhone notch; initial-scale=1 prevents auto-zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MONARIUM: Soul Duel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      width: 100%;
      height: 100%;
      background: #0a0a0f;
      overflow: hidden;
    }

    body {
      /* position:fixed + inset:0 always fills the *actual* visual viewport on all
         mobile browsers — bypasses the iOS Safari 100vh stale-dimension bug that
         keeps portrait height after rotation.  Phaser Scale.RESIZE reads
         body.offsetWidth/Height, so the canvas re-sizes correctly after rotate
         without requiring delayed refreshes. */
      position: fixed;
      inset: 0;
      background: #0a0a0f;
      overflow: hidden;
      touch-action: none;
    }

    canvas { display: block; touch-action: none; outline: none; }

    /* ── Boot / loading DOM overlay ─────────────────────────────────────────────
       Lives in front of the Phaser canvas. CSS flexbox keeps it perfectly centred
       on any viewport size or orientation — immune to Phaser coordinate-space
       timing issues and the iOS 100vh bug.  PreloadScene updates the bar via JS
       and removes the overlay when loading completes.                            */
    #boot-overlay {
      position: fixed;
      inset: 0;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 9999;
      pointer-events: auto;
      font-family: monospace;
      transition: opacity 0.35s ease;
    }
    #boot-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #boot-logo {
      font-size: clamp(32px, 9vw, 68px);
      font-weight: bold;
      color: #ff6600;
      letter-spacing: 4px;
      text-shadow: 0 0 28px #ff3300, 0 0 56px #ff330044;
      text-align: center;
    }
    #boot-tagline {
      font-size: clamp(12px, 3vw, 20px);
      color: #ffaa44;
      letter-spacing: 8px;
      text-align: center;
    }
    #boot-bar-wrap {
      width: min(300px, 64vw);
      height: 10px;
      background: #1e1e28;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 4px;
    }
    #boot-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #cc4400, #ff6600);
      border-radius: 5px;
      transition: width 0.08s linear;
    }
    #boot-status {
      font-size: 10px;
      color: #555566;
      min-height: 14px;
      letter-spacing: 1px;
    }

    /* ── Rotate prompt (portrait-only on touch devices) ────────────────────── */
    #rotate-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #0a0a0f;
      color: #ff6600;
      font-family: monospace;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 9998;
      text-align: center;
      padding: 24px;
      user-select: none;
      -webkit-user-select: none;
    }
    #rotate-overlay .icon { font-size: 52px; }
    #rotate-overlay h2   { font-size: 20px; letter-spacing: 3px; }
    #rotate-overlay p    { font-size: 13px; color: #555555; margin-top: 4px; }

    /* Show only on touch devices in portrait */
    @media (pointer: coarse) and (orientation: portrait) {
      #rotate-overlay { display: flex; }
    }

    /* ── Viewport debug overlay (?debug=1) ──────────────────────────────────── */
    #debug-overlay {
      position: fixed;
      top: 0;
      left: 0;
      background: rgba(0,0,0,0.78);
      color: #00ff88;
      font: 10px/1.6 monospace;
      padding: 6px 10px;
      z-index: 10000;
      pointer-events: none;
      white-space: pre;
      border-right: 1px solid #00ff8840;
      border-bottom: 1px solid #00ff8840;
    }
  </style>
</head>
<body>
  <!-- Boot overlay: visible immediately, removed by PreloadScene on load complete -->
  <div id="boot-overlay">
    <div id="boot-logo">MONARIUM</div>
    <div id="boot-tagline">SOUL DUEL</div>
    <div id="boot-bar-wrap"><div id="boot-bar"></div></div>
    <div id="boot-status">Loading…</div>
  </div>

  <!-- Rotate prompt: CSS-only, shown in portrait on touch devices -->
  <div id="rotate-overlay">
    <div class="icon">↺</div>
    <h2>ROTATE YOUR DEVICE</h2>
    <p>MONARIUM plays best in landscape mode</p>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
